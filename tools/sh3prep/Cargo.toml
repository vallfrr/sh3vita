[package]
name = "sh3prep"
version = "1.0.1"
edition = "2021"
description = "Prepares the Silent Hill 3 files (PC version) for the sh3vita PS Vita port"
license = "GPL-3.0-or-later"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
sha2 = "0.11.1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
opt-level = 3
strip = true
